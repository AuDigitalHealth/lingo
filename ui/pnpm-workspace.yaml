allowBuilds:
  '@sentry/cli': true
  bufferutil: true
  cypress: true
  es5-ext: false
  esbuild: true
  utf-8-validate: true

# Force transitive dependencies flagged by the Trivy dependency scan to their patched versions.
# brace-expansion is present on both its 1.x and 2.x lines. The 1.x line is patched within itself
# (1.1.16), but CVE-2026-14257 is only fixed on the current line (5.0.8), so 2.x consumers are
# forced up to it - brace-expansion's single-function API (`expand(str)`) is stable across majors.
overrides:
  brace-expansion@1: 1.1.16
  brace-expansion@2: 5.0.8
  fast-uri: ^3.1.4
  linkify-it: ^5.0.2
  postcss: ^8.5.18
